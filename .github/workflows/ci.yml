name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: mediaforge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MediaForge.sln --runtime win-x64

      - name: Build
        run: dotnet build MediaForge.sln --configuration Release --no-restore

      - name: Application unit tests
        run: dotnet test tests/MediaForge.Application.Tests/MediaForge.Application.Tests.csproj --configuration Release --no-restore --no-build --blame-hang --blame-hang-timeout 2m

      - name: Infrastructure unit tests
        run: dotnet test tests/MediaForge.Infrastructure.Tests/MediaForge.Infrastructure.Tests.csproj --configuration Release --no-restore --no-build --blame-hang --blame-hang-timeout 2m

      - name: Verify WPF publish configuration
        run: dotnet publish src/MediaForge.App/MediaForge.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/app-check

      - name: WPF startup smoke test
        shell: pwsh
        env:
          MEDIAFORGE_CI_SMOKE: "1"
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifacts/app-check/MediaForge.exe'
          $failureLog = Join-Path $env:TEMP 'MediaForge.StartupSmoke.txt'
          if (Test-Path $failureLog) { Remove-Item $failureLog -Force }

          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) { break }
            } while ((Get-Date) -lt $deadline)

            if ($process.HasExited) {
              if (Test-Path $failureLog) {
                Write-Host "MediaForge startup smoke test failed:"
                Get-Content $failureLog
              } else {
                Write-Host "MediaForge exited during startup with code $($process.ExitCode)."
              }
              throw "MediaForge did not remain running for the startup smoke window."
            }

            Write-Host "MediaForge startup smoke test passed."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
