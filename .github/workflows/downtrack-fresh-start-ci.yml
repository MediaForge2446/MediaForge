name: DownTrack Fresh Start

on:
  push:
    branches:
      - feature/downtrack-fresh-start
    paths:
      - 'DownTrack/**'
      - '.github/workflows/downtrack-fresh-start-ci.yml'
  pull_request:
    paths:
      - 'DownTrack/**'
      - '.github/workflows/downtrack-fresh-start-ci.yml'

permissions:
  contents: read

concurrency:
  group: downtrack-fresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: DownTrack
        run: dotnet restore DownTrack.sln

      - name: Build
        working-directory: DownTrack
        run: dotnet build DownTrack.sln -c Release --no-restore -p:Platform=x64

      - name: Core tests
        working-directory: DownTrack
        run: dotnet test tests/DownTrack.Core.Tests/DownTrack.Core.Tests.csproj -c Release --no-build --no-restore --logger "console;verbosity=minimal"

      - name: Application tests
        working-directory: DownTrack
        run: dotnet test tests/DownTrack.Application.Tests/DownTrack.Application.Tests.csproj -c Release --no-build --no-restore --logger "console;verbosity=minimal"
