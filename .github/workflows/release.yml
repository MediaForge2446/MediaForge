name: Release Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            profile: win-x64
            platform: x64
            architecture: x64compatible
          - rid: win-arm64
            profile: win-arm64
            platform: ARM64
            architecture: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MediaForge.sln

      - name: Build
        run: dotnet build MediaForge.sln --configuration Release --property:Platform=${{ matrix.platform }} --no-restore

      - name: Test
        run: dotnet test MediaForge.sln --configuration Release --property:Platform=${{ matrix.platform }} --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish self-contained app
        run: dotnet publish src/MediaForge/MediaForge.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --publish-profile ${{ matrix.profile }} --property:Platform=${{ matrix.platform }} --no-restore

      - name: Verify published application
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -PublishDirectory "artifacts/publish/${{ matrix.rid }}"

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 -e --version 7.1.0 --source winget --accept-package-agreements --accept-source-agreements

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" `
            "/DPublishDir=$((Get-Location).Path)\artifacts\publish\${{ matrix.rid }}" `
            "/DArchitecture=${{ matrix.architecture }}" `
            installer\MediaForge.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Join-Path (Get-Location) 'artifacts\installer\Setup.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Setup.exe was not created: $installer"
          }

      - name: Verify installer install and uninstall
        shell: pwsh
        run: ./scripts/installer-smoke-test.ps1 -InstallerPath "artifacts/installer/Setup.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-${{ matrix.rid }}
          path: artifacts/installer/Setup.exe
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*.exe
          generate_release_notes: true
