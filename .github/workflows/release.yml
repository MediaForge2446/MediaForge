name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "MediaForge version"
        required: true
        default: "0.2.0"
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  package-windows:
    if: >
      github.event_name != 'pull_request' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.ref_type == 'tag' ||
        startsWith(github.event.head_commit.message, 'release:')
      )
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      YTDLP_VERSION: "2026.08.19"
      YTDLP_URL: "https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.exe"
      YTDLP_SHA256: "66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a"
      FFMPEG_RELEASE: "autobuild-2026-09-11-13-20"
      FFMPEG_URL: "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-11-13-20/ffmpeg-n9.0.1-29-gad500d59cb-win64-gpl-shared-9.0.zip"
      FFMPEG_ARCHIVE_NAME: "ffmpeg-n9.0.1-29-gad500d59cb-win64-gpl-shared-9.0.zip"
      FFMPEG_SHA256: "174038310efd2110b92190bec810098acf5fe8d6f2c7ef24baa1876b60e8f117"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ github.event.inputs.version }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = '0.2.0'
          }

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Version must use MAJOR.MINOR.PATCH format."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MediaForge.sln --runtime win-x64

      - name: Prepare MediaForge branding
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\PrepareBranding.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE

      - name: Publish self-contained x64
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/MediaForge.App/MediaForge.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output publish `
            -p:Version=$env:VERSION `
            -p:AssemblyVersion=$($env:VERSION).0 `
            -p:FileVersion=$($env:VERSION).0 `
            -p:InformationalVersion=$env:VERSION

      - name: Download and verify yt-dlp
        shell: pwsh
        run: |
          $tools = Join-Path $env:GITHUB_WORKSPACE 'publish\tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $target = Join-Path $tools 'yt-dlp.exe'
          Invoke-WebRequest -Uri $env:YTDLP_URL -OutFile $target
          $actual = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          if ($actual -ne $env:YTDLP_SHA256) {
            throw "yt-dlp SHA-256 verification failed."
          }

      - name: Download and verify FFmpeg
        shell: pwsh
        run: |
          $tools = Join-Path $env:GITHUB_WORKSPACE 'publish\tools'
          $archive = Join-Path $tools $env:FFMPEG_ARCHIVE_NAME
          $extract = Join-Path $tools 'ffmpeg-extract'

          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $archive

          $expected = $env:FFMPEG_SHA256.ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$') {
            throw "FFmpeg SHA-256 pin is invalid."
          }

          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "FFmpeg SHA-256 verification failed."
          }

          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $archive -DestinationPath $extract -Force

          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $root) {
            throw "FFmpeg archive layout is invalid."
          }

          $destination = Join-Path $tools 'ffmpeg'
          if (Test-Path $destination) { Remove-Item $destination -Recurse -Force }
          Copy-Item -Path $root.FullName -Destination $destination -Recurse -Force
          Remove-Item $archive -Force
          Remove-Item $extract -Recurse -Force

      - name: Verify bundled tools
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\publish\tools\yt-dlp.exe")) {
            throw 'yt-dlp.exe is missing.'
          }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\publish\tools\ffmpeg\bin\ffmpeg.exe")) {
            throw 'ffmpeg.exe is missing.'
          }

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e --version 7.1.0 --source winget --accept-source-agreements --accept-package-agreements --silent

      - name: Locate Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          )

          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-ChildItem -Path "$env:ProgramFiles", "${env:ProgramFiles(x86)}" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName)
          }

          if (-not $iscc -or -not (Test-Path $iscc)) {
            throw 'Inno Setup ISCC.exe was not found after installation.'
          }

          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV
          Write-Host "Using Inno Setup compiler: $iscc"

      - name: Build Setup.exe installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE 'artifacts\Setup.exe'
          if (Test-Path $setup) { Remove-Item $setup -Force }
          New-Item -ItemType Directory -Force -Path (Split-Path $setup -Parent) | Out-Null

          & $env:ISCC_PATH `
            "/DMyAppVersion=$env:VERSION" `
            "/O$($env:GITHUB_WORKSPACE)\artifacts" `
            "$($env:GITHUB_WORKSPACE)\installer\MediaForge.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path $setup)) {
            throw "Setup.exe was not created: $setup"
          }

          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          Write-Host "Setup.exe SHA-256: $hash"

          Get-Item $setup | Select-Object Name, Length, FullName | Format-Table -AutoSize

      - name: Smoke-test Setup.exe
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE 'artifacts\Setup.exe'
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'MediaForgeInstallerSmokeTest'
          $installDir = Join-Path $smokeRoot 'install'

          if (Test-Path $smokeRoot) { Remove-Item $smokeRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          $process = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            "/DIR=$installDir"
          ) -Wait -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Installer smoke test failed with exit code $($process.ExitCode)."
          }

          $installedExe = Join-Path $installDir 'MediaForge.exe'
          if (-not (Test-Path $installedExe)) {
            throw "Installer smoke test did not install MediaForge.exe."
          }

          Write-Host "Installer smoke test passed: $installedExe"

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (Test-Path $uninstaller) {
            $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART'
            ) -Wait -PassThru

            if ($uninstallProcess.ExitCode -ne 0) {
              throw "Uninstaller smoke test failed with exit code $($uninstallProcess.ExitCode)."
            }
          }

      - name: Publish Setup.exe to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE 'artifacts\Setup.exe'
          if (-not (Test-Path $setup)) {
            throw 'Setup.exe was not created.'
          }

          gh release view $env:RELEASE_TAG --json tagName *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG exists. Replacing old installer assets."

            gh release delete-asset $env:RELEASE_TAG MediaForge.msix --yes 2>$null
            gh release delete-asset $env:RELEASE_TAG MediaForge.msixupload --yes 2>$null
            gh release delete-asset $env:RELEASE_TAG Setup.exe --yes 2>$null

            gh release upload $env:RELEASE_TAG $setup --clobber
          } else {
            $notes = @"
          ## MediaForge $env:VERSION

          Windows x64 self-contained desktop installer.

          Installer: Setup.exe
          Built with Inno Setup.
          "@
            $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            Set-Content -Path $notesFile -Value $notes -Encoding UTF8

            gh release create $env:RELEASE_TAG $setup `
              --target $env:GITHUB_SHA `
              --title "MediaForge $env:VERSION" `
              --notes-file $notesFile
          }

          gh release view $env:RELEASE_TAG --json tagName,name,isDraft,isPrerelease,assets
