name: Release Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            profile: win-x64
            platform: x64
            architecture: x64compatible
          - rid: win-arm64
            profile: win-arm64
            platform: ARM64
            architecture: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MediaForge.sln

      - name: Build
        run: dotnet build MediaForge.sln --configuration Release --property:Platform=${{ matrix.platform }} --no-restore

      - name: Publish self-contained app
        run: dotnet publish src/MediaForge/MediaForge.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true /p:PublishProfile=${{ matrix.profile }} /p:Platform=${{ matrix.platform }} --no-restore

      - name: Download Microsoft Visual C++ Redistributable
        shell: pwsh
        run: |
          $dependencyDirectory = Join-Path (Get-Location) 'artifacts\dependencies'
          New-Item -ItemType Directory -Path $dependencyDirectory -Force | Out-Null
          $redistPath = Join-Path $dependencyDirectory 'vc_redist.x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile $redistPath -UseBasicParsing
          if (-not (Test-Path -LiteralPath $redistPath -PathType Leaf)) {
            throw "Visual C++ Redistributable was not downloaded."
          }
          $signature = Get-AuthenticodeSignature -FilePath $redistPath
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Visual C++ Redistributable signature validation failed."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            $candidates = @(
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
              "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $isccPath = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          } else {
            $isccPath = $iscc.Source
          }

          if ([string]::IsNullOrWhiteSpace($isccPath) -or -not (Test-Path -LiteralPath $isccPath -PathType Leaf)) {
            throw "Inno Setup compiler (ISCC.exe) was not found after Chocolatey installation."
          }

          & $isccPath `
            "/DPublishDir=$((Get-Location).Path)\artifacts\publish\${{ matrix.rid }}" `
            "/DVCRedistPath=$((Get-Location).Path)\artifacts\dependencies\vc_redist.x64.exe" `
            "/DArchitecture=${{ matrix.architecture }}" `
            "/DAppVersion=1.0.0" `
            installer\MediaForge.iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Join-Path (Get-Location) 'artifacts\installer\Setup.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Setup.exe was not created: $installer"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-${{ matrix.rid }}
          path: artifacts/installer/Setup.exe
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*.exe
          generate_release_notes: true
