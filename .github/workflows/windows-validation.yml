name: Windows Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Windows x64
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MediaForge.sln

      - name: Build
        run: dotnet build MediaForge.sln --configuration Release --property:Platform=x64 --no-restore

      - name: Unit tests
        run: dotnet test tests/MediaForge.Core.Tests/MediaForge.Core.Tests.csproj --configuration Release --property:Platform=x64 --no-build --blame-hang-timeout 2m --logger "trx;LogFileName=unit-tests.trx"

      - name: Publish self-contained x64
        run: dotnet publish src/MediaForge/MediaForge.csproj --configuration Release --runtime win-x64 --self-contained true --publish-profile win-x64 --property:Platform=x64 --no-restore

      - name: Smoke test published app
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -PublishDirectory "artifacts/publish/win-x64"

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 -e --version 7.1.0 --source winget --accept-package-agreements --accept-source-agreements

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" `
            "/DPublishDir=$((Get-Location).Path)\artifacts\publish\win-x64" `
            "/DArchitecture=x64compatible" `
            "/DAppVersion=1.0.0" `
            installer\MediaForge.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Join-Path (Get-Location) 'artifacts\installer\Setup.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Setup.exe was not created: $installer"
          }

      - name: Verify installer install and uninstall
        shell: pwsh
        run: ./scripts/installer-smoke-test.ps1 -InstallerPath "artifacts/installer/Setup.exe"

      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Setup-win-x64
          path: artifacts/installer/Setup.exe
          if-no-files-found: error
