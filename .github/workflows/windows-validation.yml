name: Windows Validation
on:
  push:
    branches: [ main, 'rewrite/**' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/MediaForge/MediaForge.csproj
      - name: Build
        run: dotnet build src/MediaForge/MediaForge.csproj -c Release -p:Platform=x64 --no-restore
      - name: Publish self-contained x64
        shell: pwsh
        run: dotnet publish src/MediaForge/MediaForge.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishTrimmed=false -p:PublishReadyToRun=false -o "$env:GITHUB_WORKSPACE/artifacts/publish"
      - name: Add media tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/Tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile (Join-Path $tools 'yt-dlp.exe')
          $zip = Join-Path $env:TEMP 'ffmpeg.zip'
          $extract = Join-Path $env:TEMP 'ffmpeg-mf'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $zip
          if(Test-Path $extract){Remove-Item $extract -Recurse -Force}
          Expand-Archive $zip $extract -Force
          $bin = Get-ChildItem $extract -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName 'bin/ffmpeg.exe') } | Select-Object -First 1
          if($null -eq $bin){throw 'FFmpeg binaries were not found.'}
          Copy-Item (Join-Path $bin.FullName 'bin/ffmpeg.exe') (Join-Path $tools 'ffmpeg.exe') -Force
          Copy-Item (Join-Path $bin.FullName 'bin/ffprobe.exe') (Join-Path $tools 'ffprobe.exe') -Force
      - name: Download Visual C++ Redistributable
        shell: pwsh
        run: Invoke-WebRequest 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile "$env:GITHUB_WORKSPACE/artifacts/vc_redist.x64.exe"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: iscc /DPublishDir="$env:GITHUB_WORKSPACE/artifacts/publish" /DVCRedistPath="$env:GITHUB_WORKSPACE/artifacts/vc_redist.x64.exe" installer/MediaForge.iss
      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installer/Setup.exe'
          foreach($required in @('MediaForge.exe','Tools/yt-dlp.exe','Tools/ffmpeg.exe','Tools/ffprobe.exe')) { if(-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE ("artifacts/publish/"+$required)))) { throw "Missing publish dependency: $required" } }
          if(-not (Test-Path $setup)){throw 'Setup.exe was not produced.'}
          if((Get-Item $setup).Length -lt 100KB){throw 'Setup.exe is unexpectedly small.'}
      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Setup
          path: artifacts/installer/Setup.exe
          if-no-files-found: error
