name: Windows Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Windows x64
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MediaForge.sln

      - name: Build
        run: dotnet build MediaForge.sln --configuration Release --property:Platform=x64 --no-restore

      - name: Publish self-contained x64
        run: dotnet publish src/MediaForge/MediaForge.csproj --configuration Release --runtime win-x64 --self-contained true /p:PublishProfile=win-x64 /p:Platform=x64 --no-restore

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            $candidates = @(
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
              "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $isccPath = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          } else {
            $isccPath = $iscc.Source
          }

          if ([string]::IsNullOrWhiteSpace($isccPath) -or -not (Test-Path -LiteralPath $isccPath -PathType Leaf)) {
            throw "Inno Setup compiler (ISCC.exe) was not found after Chocolatey installation."
          }

          & $isccPath `
            "/DPublishDir=$((Get-Location).Path)\artifacts\publish\win-x64" `
            "/DArchitecture=x64compatible" `
            "/DAppVersion=1.0.0" `
            installer\MediaForge.iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Join-Path (Get-Location) 'artifacts\installer\Setup.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Setup.exe was not created: $installer"
          }

      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Setup-win-x64
          path: artifacts/installer/Setup.exe
          if-no-files-found: error
