name: DownTrack CI

on:
  push:
    branches:
      - feature/downtrack-fresh-start
    paths:
      - 'DownTrack/**'
      - '.github/workflows/downtrack-ci.yml'
      - '.github/workflows/downtrack-fresh-start-ci.yml'
  pull_request:
    paths:
      - 'DownTrack/**'
      - '.github/workflows/downtrack-ci.yml'
      - '.github/workflows/downtrack-fresh-start-ci.yml'

permissions:
  contents: read

concurrency:
  group: downtrack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DownTrack

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DownTrack.sln

      - name: Build
        run: dotnet build DownTrack.sln -c Release --no-restore -p:Platform=x64

      - name: Unit tests
        run: dotnet test tests/DownTrack.Core.Tests/DownTrack.Core.Tests.csproj -c Release --no-build --no-restore --logger "console;verbosity=minimal"

      - name: Application unit tests
        run: dotnet test tests/DownTrack.Application.Tests/DownTrack.Application.Tests.csproj -c Release --no-build --no-restore --logger "console;verbosity=minimal"

  package:
    runs-on: windows-2025
    needs: build-test
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DownTrack

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained x64
        run: dotnet publish src/DownTrack.App/DownTrack.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -o artifacts/publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: '& "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer\DownTrack.iss'

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts\installer\Setup.exe -Algorithm SHA256).Hash
          "Setup.exe SHA256: $hash" | Out-File artifacts\installer\SHA256.txt
          Get-Content artifacts\installer\SHA256.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DownTrack-Setup
          path: DownTrack/artifacts/installer/*
